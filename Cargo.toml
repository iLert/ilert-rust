[package]
name = "ilert"
version = "4.0.1"
authors = ["Christian Froehlingsdorf <chris@ilert.com>"]
edition = "2021"
description = "The official ilert api bindings."
keywords = ["ilert", "client", "alerting", "incident-coms", "oncall"]
readme = "README.md"
license = "MIT"
homepage = "https://ilert.com"
documentation = "https://docs.rs/ilert"
repository = "https://github.com/iLert/ilert-rust"
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "rt-multi-thread"] }